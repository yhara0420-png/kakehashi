<style>
:root{
  --paper:#EFECF8;--paper-2:#DFD9F0;--ink:#1A1A2E;--ink-soft:#44445E;
  --muted:#8A86A8;--line:#1a1a2e18;--accent:#7B6CE0;--paper-rgb:239,236,248;
  --serif:"Zen Old Mincho",serif;--sans:"Zen Kaku Gothic New",sans-serif;--mono:"DM Mono",monospace;
  --maxw:880px;--ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media(max-width:760px){html{scroll-behavior:auto}}   /* iPhone Safari はバーの出入り時の位置補正まで滑らかに動き「一瞬ずれる」ため、スマホは切る（2026-09-12） */
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.9;
  overflow-x:hidden;font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--paper)}

.bg-grid{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:88px 88px;
  -webkit-mask-image:radial-gradient(ellipse 120% 80% at 50% 0%,#000 30%,transparent 78%);
          mask-image:radial-gradient(ellipse 120% 80% at 50% 0%,#000 30%,transparent 78%);opacity:.5}

/* NAV */
header.nav{position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;
  padding:14px clamp(20px,5vw,64px);background:rgba(var(--paper-rgb),.82);
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-weight:700;font-size:1.16rem;letter-spacing:.02em}
.brand .seal{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:.95rem}
.brand small{font-family:var(--mono);font-size:.58rem;letter-spacing:.18em;color:var(--muted);display:block;text-transform:uppercase}
.nav-back{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;padding:9px 18px;
  border:1px solid var(--ink);border-radius:40px;transition:all .3s var(--ease)}
.nav-back:hover{background:var(--ink);color:var(--paper)}

/* DOC */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(20px,5vw,40px);position:relative;z-index:1}
.doc-head{padding:clamp(60px,9vw,110px) 0 clamp(34px,4vw,52px)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--accent);display:inline-flex;align-items:center;gap:.7em}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--accent);display:inline-block}
.doc-head h1{font-family:var(--serif);font-weight:900;font-size:clamp(2rem,6vw,3.4rem);
  line-height:1.2;margin:.5em 0 .35em}
.doc-head .intro{color:var(--ink-soft);max-width:60ch;font-size:1.02rem}
.doc-head .meta{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;color:var(--muted);margin-top:24px}

.doc-body{padding-bottom:clamp(70px,10vw,120px)}
.doc-body section{margin-top:clamp(36px,4.4vw,54px)}
.doc-body h2{font-family:var(--serif);font-weight:700;font-size:clamp(1.25rem,2.6vw,1.6rem);
  line-height:1.45;margin-bottom:14px;display:flex;gap:14px;align-items:baseline}
.doc-body h2 .n{font-family:var(--mono);font-size:.82rem;color:var(--accent);letter-spacing:.06em;flex-shrink:0}
.doc-body p{color:var(--ink-soft);font-size:1rem;margin-bottom:12px}
.doc-body ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin:14px 0 4px}
.doc-body li{font-size:1rem;color:var(--ink-soft);display:flex;gap:12px;align-items:flex-start}
.doc-body li::before{content:"+";font-family:var(--mono);color:var(--accent);flex-shrink:0;font-weight:500}
.doc-body a.link{border-bottom:1px solid var(--accent);padding-bottom:1px;color:var(--ink)}
.doc-body a.link:hover{color:var(--accent)}
.doc-body .table{margin:16px 0 4px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.doc-body .table dl{display:grid;grid-template-columns:200px 1fr;gap:6px 22px;margin:0;
  padding:18px 22px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.4)}
.doc-body .table dl:last-child{border-bottom:0}
.doc-body .table dt{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.doc-body .table dd{margin:0;font-size:.98rem;color:var(--ink)}
.callout{background:rgba(123,108,224,.05);border:1px solid rgba(123,108,224,.26);border-radius:14px;
  padding:20px 24px;margin-top:18px}
.callout p{margin:0;color:var(--ink-soft);font-size:.96rem}
.callout b{color:var(--ink)}

/* FOOTER */
footer{border-top:1px solid var(--line);padding:46px 0 40px;position:relative;z-index:1}
.foot-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:center}
.foot-row .brand{font-size:1rem}
.foot-links{display:flex;gap:22px;flex-wrap:wrap;font-size:.88rem;color:var(--ink-soft)}
.foot-links a:hover{color:var(--accent)}
.foot-copy{margin-top:30px;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--muted)}

@media(max-width:640px){
  .doc-body .table dl{grid-template-columns:1fr;gap:4px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
